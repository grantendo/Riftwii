# A flat, dark console look for a 480-line picture: a charcoal backdrop,
# flat grey buttons with no gloss and no outlines, and a bold cyan ring for
# whatever is focused. Colours after RetroArch's Ozone dark theme
# (GPL-3.0-or-later). The pictures come from
# tools/make_midnight_classic_theme.py.
[theme]
name = Midnight Classic
author = grantendo

[shape]
corners = 0.5
gloss = no
# Home: no bar; its round buttons in one row on a dock, the clock top right
bar = dock
home_menu = wii
shelf_grain = no
# A focused thing keeps its size: only the ring shows the focus
hover = still

[backdrop]
stripes = no

[colors]
# Text: white, then Ozone's grey for second lines
ink = #FFFFFF
ink_soft = #D2D2D4
ink_dim = #A3A3A5
clock = #FFFFFF
# The focus: the cursor's cyan; switched-on values a turquoise
accent = #35C0EE
accent_ink = #2EE6C0
text_on_accent = #FFFFFF
warn = #F2545B

# Flat grey cards a clear step lighter than the backdrop. Their edges are
# the card's own colour (no outlines) and there is no shadow.
card = #2F2F2F
card_edge = #2F2F2F
card_edge_strong = #2F2F2F
shadow = #00000000
glow = #35C0EE33
glyph = #E8E8EA

# Option chips and switches
chip_on = #1F4D5E
chip_off = #262626
chip_off_edge = #262626
switch_off = #5A5A5C

# One charcoal everywhere: the bands and the bar match the backdrop
bar = #1C1C1C
backdrop = #1C1C1C
backdrop_stripe = #1C1C1C
banner_stripe = #FFFFFF0A
banner_tint = #1C1C1C59

# Lists and badges
divider = #333333
scroll_track = #2F2F2F
scroll_thumb = #6A6A6C
badge = #404040
shelf = #2F2F2F
shelf_edge = #141414

# Player pointers
pointer1 = #3B8FD6
pointer2 = #E05252
pointer3 = #48B858
pointer4 = #E5AC24
